name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build universal binary
        run: make CFLAGS="-O2 -Wall -arch arm64 -arch x86_64"
      - name: Package
        run: tar -czf parking-${{ github.ref_name }}-macos-universal.tar.gz parking
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: parking-*.tar.gz

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncursesw5-dev
      - name: Build
        run: make
      - name: Package
        run: tar -czf parking-${{ github.ref_name }}-linux-x86_64.tar.gz parking
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: parking-*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pdcurses
            make
            zip
      - name: Build (static)
        run: make CC=gcc CFLAGS="-O2 -Wall -static"
      - name: Package
        run: zip parking-${{ github.ref_name }}-windows-x86_64.zip parking.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: parking-*.zip

  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum parking-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            parking-*
            SHA256SUMS
